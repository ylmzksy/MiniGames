<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nim Master</title>
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-home="../index.html">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="game-board" class="board"></div>
        <div class="controls">
            <select id="difficulty">
                <option value="master" data-i18n="master">Master</option>
                <option value="novice" data-i18n="novice">Novice</option>
            </select>
            <button id="setupBtn" class="primary" data-i18n="reset">New Game</button>
        </div>
    </div>

    <div id="setupModal" class="modal" data-static>
        <div class="modal-content">
            <h2 data-i18n="setup_title">New Game</h2>

            <div id="step1" class="setup-step">
                <p data-i18n="setup_piles">How many piles?</p>
                <div class="btn-grid">
                    <button onclick="setPileCount(1)">1</button>
                    <button onclick="setPileCount(2)">2</button>
                    <button onclick="setPileCount(3)">3</button>
                    <button onclick="setPileCount(4)">4</button>
                    <button onclick="setPileCount(5)">5</button>
                </div>
            </div>

            <div id="step2" class="setup-step" style="display:none;">
                <p data-i18n="setup_tap">Tap a pile to set sticks</p>
                <div id="setup-preview" class="board setup-preview"></div>
                <button class="primary wide" onclick="finalizeGame()" data-i18n="start_game">Start Game</button>
            </div>

            <div id="step3" class="setup-step" style="display:none;">
                <p id="step3-prompt"></p>
                <div id="step3-buttons" class="btn-grid"></div>
                <button class="wide" onclick="backToStep2()" data-i18n="back">Back</button>
            </div>
        </div>
    </div>

    <div id="actionMenu" class="sheet">
        <p id="remove-prompt" data-i18n="remove_prompt">Remove how many?</p>
        <div id="buttonGrid" class="btn-grid"></div>
        <button id="cancelBtn" class="wide" data-i18n="cancel">Cancel</button>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="engine.js"></script>
    <script src="ui.js"></script>
</body>
</html>
