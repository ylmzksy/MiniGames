<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Game of Life Architect</title>
</head>
<body data-home="../index.html" data-game="gameoflife">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="goal" class="goal"></div>
        <div id="game-grid" class="grid-container"></div>
        <div class="controls">
            <button id="playBtn" class="primary">▶ Play</button>
            <button id="resetBtn" data-i18n="reset">Reset</button>
            <button id="settingsBtn" data-i18n="settings">Rules</button>
            <button onclick="LevelSelect.open(loadLevel)" data-i18n="levels_button">Levels</button>
        </div>
    </div>

    <!-- Settings Modal (Rule Customization) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2 data-i18n="rules">Evolution Rules</h2>
            <label><span data-i18n="born">Born</span>
                <select id="bornRules">
                    <option value="2">2</option>
                    <option value="2,3">2,3</option>
                    <option value="3">3</option>
                    <option value="3,4">3,4</option>
                    <option value="2,3,4">2,3,4</option>
                </select>
            </label>
            <label><span data-i18n="survive">Survive</span>
                <select id="surviveRules">
                    <option value="2">2</option>
                    <option value="2,3">2,3</option>
                    <option value="3">3</option>
                    <option value="3,4">3,4</option>
                    <option value="4,5,6">4,5,6</option>
                    <option value="5">5</option>
                </select>
            </label>
            <div class="modal-actions">
                <button onclick="Shell.closeModal('settingsModal')" data-i18n="close">Close</button>
                <button class="primary" onclick="updateRules()" data-i18n="apply">Apply Rules</button>
            </div>
        </div>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="engine.js"></script>
    <script src="levels/challenge1.js"></script>
    <script src="levels/glider.js"></script>
    <script src="ui.js"></script>
</body>
</html>
