<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Pentago</title>
</head>
<body data-home="../index.html" data-game="pentago">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="level-info" class="level-info"></div>
        <div id="game-board" class="board"></div>
        <div class="rotations">
            <div class="quad-ctl"><button onclick="handleRotate(0, 'ccw')" aria-label="Top-left counterclockwise">↺</button><span>↖</span><button onclick="handleRotate(0, 'cw')" aria-label="Top-left clockwise">↻</button></div>
            <div class="quad-ctl"><button onclick="handleRotate(1, 'ccw')" aria-label="Top-right counterclockwise">↺</button><span>↗</span><button onclick="handleRotate(1, 'cw')" aria-label="Top-right clockwise">↻</button></div>
            <div class="quad-ctl"><button onclick="handleRotate(2, 'ccw')" aria-label="Bottom-left counterclockwise">↺</button><span>↙</span><button onclick="handleRotate(2, 'cw')" aria-label="Bottom-left clockwise">↻</button></div>
            <div class="quad-ctl"><button onclick="handleRotate(3, 'ccw')" aria-label="Bottom-right counterclockwise">↺</button><span>↘</span><button onclick="handleRotate(3, 'cw')" aria-label="Bottom-right clockwise">↻</button></div>
        </div>
        <div id="counters" class="counters"></div>
        <div class="controls">
            <select id="difficulty">
                <option value="novice" data-i18n="novice">Novice</option>
                <option value="master" data-i18n="master">Master</option>
            </select>
            <button onclick="LevelSelect.open(loadLevel)" data-i18n="levels_button">Levels</button>
            <button id="restartBtn" class="primary" data-i18n="restart">Restart Level</button>
        </div>
    </div>
    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="engine.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="levels/level4.js"></script>
    <script src="levels/level5.js"></script>
    <script src="levels/level6.js"></script>
    <script src="ui.js"></script>
</body>
</html>
