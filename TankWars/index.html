<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Tank Wars</title>
</head>
<body data-home="../index.html" data-game="tankwars">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="level-info" class="level-info"></div>
        <div id="wind" class="wind"></div>
        <div id="game-board" class="board"><canvas id="game-canvas" width="640" height="360"></canvas></div>
        <div class="health">
            <div class="side you"><span data-i18n="hp_you">You</span><div class="bar you"><i id="hp-you"></i></div><span class="hp">100</span></div>
            <div class="side ai"><span data-i18n="hp_ai">AI</span><div class="bar ai"><i id="hp-ai"></i></div><span class="hp">100</span></div>
        </div>
        <div class="aim">
            <label><span data-i18n="angle">Angle</span><input id="angle" type="number" min="0" max="90" value="45"></label>
            <label><span data-i18n="power">Power</span><input id="power" type="number" min="1" max="100" value="60"></label>
            <button id="fireBtn" class="primary" onclick="fire()" data-i18n="fire">Fire</button>
        </div>
        <div id="counters" class="counters"></div>
        <div class="controls">
            <select id="difficulty">
                <option value="novice" data-i18n="novice">Novice</option>
                <option value="master" data-i18n="master">Master</option>
            </select>
            <button onclick="LevelSelect.open(loadLevel)" data-i18n="levels_button">Levels</button>
            <button id="restartBtn" data-i18n="restart">Restart Level</button>
        </div>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="engine.js"></script>

    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="levels/level4.js"></script>
    <script src="levels/level5.js"></script>
    <script src="levels/level6.js"></script>

    <script src="ui.js"></script>
</body>
</html>
