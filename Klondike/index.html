<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="../common/cards.css">
    <link rel="stylesheet" href="../common/solitaire.css">
    <title>Klondike</title>
</head>
<body data-home="../index.html" data-game="klondike">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="level-info" class="level-info"></div>
        <div id="table" class="table sol-table"></div>
        <div id="counters" class="counters"></div>
        <div class="controls">
            <button id="undoBtn" data-i18n="undo">Undo</button>
            <button id="autoBtn" data-i18n="auto">Auto</button>
            <button id="newDealBtn" data-i18n="new_deal">New deal</button>
        </div>
        <div class="controls">
            <button onclick="LevelSelect.open(idx => SolitaireGame.loadLevel(idx))" data-i18n="levels_button">Levels</button>
            <button id="restartBtn" class="primary" data-i18n="restart">Restart</button>
        </div>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="../common/solitaire-i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="../common/cards.js"></script>
    <script src="../common/solitaire.js"></script>

    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="levels/level4.js"></script>
    <script src="levels/level5.js"></script>

    <script src="ui.js"></script>
</body>
</html>
