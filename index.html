<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="common/theme.css">
    <title>Mini Games</title>
    <style>
        .game-list {
            display: grid;
            gap: 12px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 16px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            color: var(--text);
            text-align: left;
            text-decoration: none;
            transition: border-color 0.15s, transform 0.1s;
        }

        .game-card:hover { border-color: var(--accent); }
        .game-card:active { transform: scale(0.99); }
        .game-card strong { font-size: 1.1rem; }
        .game-card span { color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="app">
        <nav class="game-list">
            <a class="game-card" href="LightsOut/index.html">
                <strong data-i18n="lights_title"></strong>
                <span data-i18n="lights_desc"></span>
            </a>
            <a class="game-card" href="GameOfLife/index.html">
                <strong data-i18n="life_title"></strong>
                <span data-i18n="life_desc"></span>
            </a>
            <a class="game-card" href="nim-game/index.html">
                <strong data-i18n="nim_title"></strong>
                <span data-i18n="nim_desc"></span>
            </a>
            <a class="game-card" href="Wordgrid/index.html">
                <strong data-i18n="word_title"></strong>
                <span data-i18n="word_desc"></span>
            </a>
            <a class="game-card" href="Hackenbush/index.html">
                <strong data-i18n="hack_title"></strong>
                <span data-i18n="hack_desc"></span>
            </a>
            <a class="game-card" href="Kakuro/index.html">
                <strong data-i18n="kakuro_title"></strong>
                <span data-i18n="kakuro_desc"></span>
            </a>
        </nav>
    </div>

    <script src="common/i18n.js"></script>
    <script>

                kakuro_title: "Kakuro",
