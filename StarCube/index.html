<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Star Cube</title>
</head>
<body data-home="../index.html" data-game="starcube">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="level-info" class="level-info"></div>
        <div class="views">
            <figure>
                <canvas id="view" class="space"></canvas>
                <figcaption data-i18n="your_view">Your cube</figcaption>
            </figure>
            <figure>
                <canvas id="target" class="space target"></canvas>
                <figcaption data-i18n="target_view">Target</figcaption>
            </figure>
        </div>
        <div id="meter" class="meter" hidden><span></span></div>
        <div id="counters" class="counters"></div>
        <div class="turn-pad">
            <button data-turn="z:1" aria-label="Roll left">⟲</button>
            <button data-turn="x:-1" aria-label="Tilt up">↑</button>
            <button data-turn="z:-1" aria-label="Roll right">⟳</button>
            <button data-turn="y:-1" aria-label="Turn left">←</button>
            <button data-turn="x:1" aria-label="Tilt down">↓</button>
            <button data-turn="y:1" aria-label="Turn right">→</button>
        </div>
        <p class="drag-hint" data-i18n="drag_hint">Drag the cube to spin it; shift-drag rolls it</p>
        <div class="controls">
            <button id="undoBtn" data-i18n="undo">Undo</button>
            <button onclick="LevelSelect.open(loadLevel)" data-i18n="levels_button">Levels</button>
            <button id="restartBtn" class="primary" data-i18n="restart">Restart Level</button>
        </div>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="../common/stars3d.js"></script>
    <script src="engine.js"></script>

    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="levels/level4.js"></script>
    <script src="levels/level5.js"></script>
    <script src="levels/level6.js"></script>
    <script src="levels/level7.js"></script>
    <script src="levels/level8.js"></script>
    <script src="levels/level9.js"></script>
    <script src="levels/level10.js"></script>

    <script src="ui.js"></script>
</body>
</html>
