<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Number Chain</title>
</head>
<body data-home="../index.html" data-game="numberchain">
    <div id="app">
        <div id="status" class="status"></div>
        <div class="level-row">
            <span id="level-info" class="level-info"></span>
            <span id="mode" class="mode"></span>
        </div>
        <div id="game-board" class="board"></div>
        <div id="pad" class="pad">
            <div class="suggest">
                <span class="suggest-label" data-i18n="suggest">Likely:</span>
                <span id="suggestions" class="suggestions"></span>
            </div>
            <div class="keys">
                <button data-key="1">1</button>
                <button data-key="2">2</button>
                <button data-key="3">3</button>
                <button data-key="4">4</button>
                <button data-key="5">5</button>
                <button data-key="erase" class="wide-key" data-i18n="erase">Erase</button>
                <button data-key="6">6</button>
                <button data-key="7">7</button>
                <button data-key="8">8</button>
                <button data-key="9">9</button>
                <button data-key="0">0</button>
                <button data-key="enter" class="wide-key primary" data-i18n="confirm">Enter</button>
            </div>
        </div>
        <div id="counters" class="counters"></div>
        <div class="controls">
            <button id="undoBtn" data-i18n="undo">Undo</button>
            <button id="clearBtn" data-i18n="clear">Clear</button>
        </div>
        <div class="controls">
            <button onclick="LevelSelect.open(loadLevel)" data-i18n="levels_button">Levels</button>
            <button id="restartBtn" class="primary" data-i18n="restart">Restart Level</button>
        </div>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="engine.js"></script>

    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="levels/level4.js"></script>
    <script src="levels/level5.js"></script>
    <script src="levels/level6.js"></script>
    <script src="levels/level7.js"></script>
    <script src="levels/level8.js"></script>
    <script src="levels/level9.js"></script>
    <script src="levels/level10.js"></script>

    <script src="ui.js"></script>
</body>
</html>
