<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Threes</title>
</head>
<body data-home="../index.html" data-game="threes">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="level-info" class="level-info"></div>
        <div class="next"><span data-i18n="next">Next</span><div id="next-tile"></div></div>
        <div id="game-board" class="board"></div>
        <div id="counters" class="counters"></div>
        <div class="dpad">
            <button class="up" onclick="slide('up')" aria-label="Up">↑</button>
            <button class="left" onclick="slide('left')" aria-label="Left">←</button>
            <button class="down" onclick="slide('down')" aria-label="Down">↓</button>
            <button class="right" onclick="slide('right')" aria-label="Right">→</button>
        </div>
        <div class="controls">
            <button id="nextBtn" class="primary" data-i18n="next_level" hidden>Next level</button>
            <button onclick="LevelSelect.open(loadLevel)" data-i18n="levels_button">Levels</button>
            <button id="restartBtn" data-i18n="restart">New Game</button>
        </div>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="engine.js"></script>

    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="levels/level4.js"></script>
    <script src="levels/level5.js"></script>
    <script src="levels/level6.js"></script>

    <script src="ui.js"></script>
</body>
</html>
