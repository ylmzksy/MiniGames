<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="style.css">
    <title>Quarter Turns</title>
</head>
<body data-home="../index.html" data-game="quarterturns">
    <div id="app">
        <div id="status" class="status"></div>
        <div id="level-info" class="level-info"></div>
        <div class="goal-row">
            <div class="goal-box">
                <span data-i18n="target">Target</span>
                <div id="goal-preview" class="goal-preview"></div>
            </div>
            <div id="counters" class="counters"></div>
        </div>
        <div id="game-board" class="qboard"><div id="grid" class="qgrid"></div></div>
        <div class="controls">
            <button id="dirBtn" class="dir-btn">↻</button>
            <button id="undoBtn" data-i18n="undo">Undo</button>
        </div>
        <div class="controls">
            <button onclick="LevelSelect.open(loadLevel)" data-i18n="levels_button">Levels</button>
            <button id="restartBtn" class="primary" data-i18n="restart">Restart Level</button>
        </div>
    </div>

    <script src="../common/i18n.js"></script>
    <script src="i18n.js"></script>
    <script src="../common/shell.js"></script>
    <script src="../common/levels.js"></script>
    <script src="../common/progress.js"></script>
    <script src="engine.js"></script>

    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="levels/level4.js"></script>
    <script src="levels/level5.js"></script>
    <script src="levels/level6.js"></script>
    <script src="levels/level7.js"></script>
    <script src="levels/level8.js"></script>
    <script src="levels/level9.js"></script>
    <script src="levels/level10.js"></script>

    <script src="ui.js"></script>
</body>
</html>
